name: Update Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Prepare output directory
        run: mkdir -p assets/github/${{ matrix.theme }}

      # -------------------------------
      # Contribution Calendar
      # -------------------------------
      - name: Generate contribution calendar
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.METRICS_TOKEN }}
          username: shantam-sharma
          cards: contributions
          output-dir: assets/github/${{ matrix.theme }}
          themes: ${{ matrix.theme }}
          commit: false

      # -------------------------------
      # Streak
      # -------------------------------
      - name: Generate streak stats
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=shantam-sharma&theme=default&disable_animations=true
          path: assets/github/${{ matrix.theme }}/streak.svg
          token: ${{ secrets.METRICS_TOKEN }}
      # -------------------------------
      # Upload theme artifact (avoid parallel push races)
      # -------------------------------
      - name: Show generated files
        run: |
          echo "Listing assets/github/${{ matrix.theme }}"
          ls -la assets/github || true

      - name: Upload theme artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.theme }}
          path: assets/github/${{ matrix.theme }}

  # -------------------------------
  # Publish job: download all artifacts and push once
  # -------------------------------
  publish:
    runs-on: ubuntu-latest
    needs: profile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts into assets/github
        run: |
          mkdir -p assets/github
          for d in artifacts/*; do
            name=$(basename "$d")
            mv "$d" assets/github/"$name"
          done

      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github/

          if git diff --cached --quiet; then
            echo "No profile changes."
            exit 0
          fi

          git commit -m "chore: update profile stats"
          git push
