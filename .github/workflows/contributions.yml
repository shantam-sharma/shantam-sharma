name: Update Contribution Calendar

on:
  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime

          USERNAME = "shantam-sharma"

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": USERNAME
              }
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "github-contribution-calendar"
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.loads(response.read())

          if "errors" in data:
              raise RuntimeError(data["errors"])

          calendar = (
              data["data"]["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
          )

          weeks = calendar["weeks"]
          total = calendar["totalContributions"]

          # GitHub contribution colors.
          colors = [
              "#161b22",
              "#3f4a20",
              "#596a2c",
              "#71833b",
              "#8fa04c"
          ]

          cell = 12
          gap = 4

          left = 40
          top = 30

          width = left + len(weeks) * (cell + gap)
          height = 150

          svg = []

          svg.append(
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" height="{height}" '
              f'viewBox="0 0 {width} {height}">'
          )

          svg.append("""
          <style>
            text {
              font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            }
          </style>
          """)

          svg.append(
              f'<text x="0" y="16" fill="#c9d1d9" '
              f'font-size="12">Less</text>'
          )

          svg.append(
              f'<text x="{width - 32}" y="16" fill="#c9d1d9" '
              f'font-size="12">More</text>'
          )

          # Month labels
          previous_month = None

          for week_index, week in enumerate(weeks):
              days = week["contributionDays"]

              for day_index, day in enumerate(days):

                  count = day["contributionCount"]

                  if count == 0:
                      level = 0
                  elif count <= 2:
                      level = 1
                  elif count <= 5:
                      level = 2
                  elif count <= 10:
                      level = 3
                  else:
                      level = 4

                  x = left + week_index * (cell + gap)
                  y = top + day_index * (cell + gap)

                  date = day["date"]

                  svg.append(
                      f'<rect x="{x}" y="{y}" '
                      f'width="{cell}" height="{cell}" '
                      f'rx="2" fill="{colors[level]}">'
                      f'<title>{date}: {count} contributions</title>'
                      f'</rect>'
                  )

                  month = datetime.strptime(
                      date,
                      "%Y-%m-%d"
                  ).strftime("%b")

                  if (
                      day_index == 0
                      and month != previous_month
                  ):
                      svg.append(
                          f'<text x="{x}" y="25" '
                          f'fill="#8b949e" font-size="10">'
                          f'{month}</text>'
                      )

                      previous_month = month

          # Total contributions
          svg.append(
              f'<text x="0" y="{height - 12}" '
              f'fill="#c9d1d9" font-size="12">'
              f'{total} contributions in the last year'
              f'</text>'
          )

          svg.append("</svg>")

          os.makedirs("assets", exist_ok=True)

          with open(
              "assets/contribution-calendar.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write("\n".join(svg))

          print(
              f"Generated contribution calendar "
              f"with {total} contributions."
          )
          PY

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-calendar.svg

          if git diff --cached --quiet; then
            echo "No changes to contribution calendar."
            exit 0
          fi

          git commit -m "chore: update contribution calendar"
          git push
