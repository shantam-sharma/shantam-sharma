name: Update GitHub Contribution Calendar

on:
  schedule:
    - cron: "17 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution card
        uses: seijikohara/profile-cards-action@v1
        with:
          username: shantam-sharma
          cards: contributions
          output_dir: assets/github
          commit: true
          commit_message: "chore: update contribution calendar"
